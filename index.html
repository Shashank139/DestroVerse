<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DestroVerse</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-family:Arial, sans-serif;
    color:white;

    background:
    radial-gradient(circle at center,
    #220000 0%,
    #120000 35%,
    #050505 100%);
}

.container{
    max-width:900px;
    padding:20px;
}

.logo{
    width:420px;
    max-width:90%;
    margin-bottom:20px;

    filter:
        drop-shadow(0 0 20px rgba(255,0,0,0.35))
        drop-shadow(0 0 40px rgba(255,0,0,0.20));
}

.subtitle{
    color:#ff3b3b;
    font-size:1.3rem;
    letter-spacing:2px;
    margin-bottom:40px;
    font-weight:bold;
    line-height:1.8;
}

.kannada{
    color:#d9d9d9;
    font-size:1rem;
    font-weight:normal;
}

.discord-btn{
    display:inline-block;
    padding:16px 34px;
    background:linear-gradient(
        90deg,
        #5865F2,
        #4752C4
    );

    color:white;
    text-decoration:none;
    font-weight:bold;
    border-radius:12px;

    box-shadow:
        0 0 15px rgba(88,101,242,.5),
        0 0 30px rgba(88,101,242,.3);

    transition:.3s;
}

.discord-btn:hover{
    transform:scale(1.05);

    box-shadow:
        0 0 25px rgba(88,101,242,.7),
        0 0 50px rgba(88,101,242,.4);
}

.youtube-btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 26px;

    background:linear-gradient(
        90deg,
        #cc0000,
        #990000
    );

    color:white;
    text-decoration:none;
    font-weight:bold;

    border-radius:10px;

    box-shadow:
        0 0 10px rgba(255,0,0,.35),
        0 0 20px rgba(255,0,0,.15);

    transition:.3s;
}

.youtube-btn:hover{
    transform:scale(1.05);

    box-shadow:
        0 0 20px rgba(255,0,0,.55),
        0 0 40px rgba(255,0,0,.25);
}

.footer{
    margin-top:35px;
    color:#999;
    letter-spacing:1px;
}

@media(max-width:768px){

.logo{
    width:300px;
}

.subtitle{
    font-size:1rem;
}

.kannada{
    font-size:0.9rem;
}

.discord-btn{
    width:90%;
}

.youtube-btn{
    width:80%;
}
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png.png" alt="DestroVerse Logo" class="logo">

<div class="subtitle">
    A HOME FOR KANNADA PC GAMERS

    <div class="kannada">
        ಕರ್ನಾಟಕದಿಂದ. ಗೇಮರ್‌ಗಳಿಗಾಗಿ.
    </div>

    <div class="kannada">
        🎮 ಆಟ ಶುರು ಆಗಲಿ!
    </div>
</div>

<a class="discord-btn"
href="https://discord.gg/nayRUfHvJY"
target="_blank">
🚀 JOIN DESTROVERSE DISCORD
</a>

<br>

<a class="youtube-btn"
href="https://www.youtube.com/@destroverse"
target="_blank">
📺 SUBSCRIBE ON YOUTUBE
</a>

<div class="footer">
The reboot has begun.
</div>

</div>

</body>
</html>
